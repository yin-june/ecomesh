services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecomesh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecomesh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: um_technothon
      DOCKER_INFLUXDB_INIT_BUCKET: sensor_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ecomesh-secure-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: super-secret-ecomesh-key
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_SERVER: postgres
      POSTGRES_DB: ecomesh_db
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ecomesh-secure-token
      INFLUX_ORG: um_technothon
      INFLUX_BUCKET: sensor_metrics
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  influxdb_data: